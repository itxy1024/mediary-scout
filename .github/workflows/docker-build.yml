name: 构建并发布 Docker 镜像

on:
  # 推送到默认分支时构建 latest 镜像
  push:
    branches:
      - main
    tags:
      - "v*"

  # 允许在 GitHub Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一分支有多个构建时，只保留最新的一次
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v7

      - name: 生成小写镜像名称
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 Docker 镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # 使用 GitHub Actions 构建缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # Mediary Scout 的 Dockerfile 会记录构建提交
          build-args: |
            GIT_SHA=${{ github.sha }}
            MEDIA_TRACK_ALLOWED_ORIGINS=${{ vars.MEDIA_TRACK_ALLOWED_ORIGINS }}
