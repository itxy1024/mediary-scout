# media-track 自部署:一把拉起 web(Next + 进程内 worker) / Postgres / PanSou。
#   docker compose up -d   →   打开 http://<host>:3000   →   设置页扫码连 115 即用
# TMDB 经 §1 CF Worker 开箱即用;LLM key / 自己的 TMDB key / Prowlarr 在设置页填。
# ---- Docker Hub 镜像源(墙内必读) ----
#
# 本文件里三个镜像来自 Docker Hub:postgres、node(见 Dockerfile)、cloudflared。
# **在中国大陆,Docker Hub 经常拉不动** —— 表现为
# `failed to fetch anonymous token: ... EOF` 或 `connection reset by peer`。
# 这不是你的配置错了,是 registry-1.docker.io / auth.docker.io 不可达。
#
# 解决:在 .env 里设一个镜像源前缀,三处会一起生效:
#
#   DOCKER_MIRROR=docker.1ms.run
#
# 已实测可用(2026-08-01,大陆直连):
#   docker.1ms.run  ·  dockerproxy.net  ·  docker.m.daocloud.io  ·  hub.rat.dev
# 换一个不通就换下一个 —— 公共镜像站会轮流失效,别只记住一个。
#
# 留空(默认)= 直连 Docker Hub 官方,境外网络无需任何设置。
# 注意 pansou 走的是 ghcr.io,**不受此变量影响**(ghcr 在墙内通常可直连)。
#
# build 阶段(Dockerfile 里的 node 基础镜像)要同一个值:
#   docker compose build --build-arg DOCKER_MIRROR=docker.1ms.run web
# 或者更省事:把 DOCKER_MIRROR 写进 .env,compose 会自动传给 build args。

name: mediary-scout

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediatrack
      POSTGRES_USER: mediatrack
      POSTGRES_PASSWORD: mediatrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediatrack -d mediatrack"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  pansou:
    image: ${PANSOU_IMAGE:-ghcr.io/fish2018/pansou-web:latest}
    ports:
      - "8890:80"
    env_file:
      - ./.env
    logging: *default-logging
    restart: unless-stopped

  web:
    image: ghcr.io/itxy1024/mediary-scout:latest
    pull_policy: always

    depends_on:
      postgres:
        condition: service_healthy
      pansou:
        condition: service_started

    environment:
      MEDIA_TRACK_POSTGRES_URL: postgres://mediatrack:mediatrack@postgres:5432/mediatrack
      PANSOU_BASE_URL: http://pansou
      MEDIA_TRACK_SEARCH_PROVIDER: tmdb
      MEDIA_TRACK_WORKFLOW_ADAPTER: pansou
      MEDIA_TRACK_STORAGE_ADAPTER: "115"
      MEDIA_TRACK_AGENT_ADAPTER: vercel-ai
      MEDIA_TRACK_DEMO_SEED: "0"
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

    env_file:
      - path: .env
        required: false

    ports:
      - "${WEB_PORT:-13000}:3000"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e
          "fetch('http://127.0.0.1:3000/api/health')
          .then(r=>process.exit(r.ok?0:1))
          .catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging: *default-logging
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_TRANSPORT_PROTOCOL:-auto}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  pgdata:
