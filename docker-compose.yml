# media-track 自部署:直接拉取 web 成品镜像,并启动 Postgres / PanSou。
#   docker compose up -d   →   打开 http://<host>:13000   →   设置页扫码连接网盘
# web 与 PanSou 来自 ghcr.io;Postgres 与 cloudflared 来自 Docker Hub。
# 中国大陆拉取 Docker Hub 失败时,请配置 Docker daemon 的 registry-mirrors;
# .env 中的 DOCKER_MIRROR 仅供手动执行 docker build --build-arg 使用,
# 不会改写本 Compose 文件里的 image 地址。

name: mediary-scout

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediatrack
      POSTGRES_USER: mediatrack
      POSTGRES_PASSWORD: mediatrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediatrack -d mediatrack"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  pansou:
    image: ${PANSOU_IMAGE:-ghcr.io/fish2018/pansou-web:latest}
    ports:
      - "8890:80"
    env_file:
      - path: .env
        required: false
    logging: *default-logging
    restart: unless-stopped

  web:
    image: ghcr.io/itxy1024/mediary-scout:latest
    pull_policy: always

    depends_on:
      postgres:
        condition: service_healthy
      pansou:
        condition: service_started

    environment:
      MEDIA_TRACK_POSTGRES_URL: postgres://mediatrack:mediatrack@postgres:5432/mediatrack
      PANSOU_BASE_URL: http://pansou
      MEDIA_TRACK_SEARCH_PROVIDER: tmdb
      MEDIA_TRACK_WORKFLOW_ADAPTER: pansou
      MEDIA_TRACK_STORAGE_ADAPTER: "115"
      MEDIA_TRACK_AGENT_ADAPTER: vercel-ai
      MEDIA_TRACK_DEMO_SEED: "0"
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

    env_file:
      - path: .env
        required: false

    ports:
      - "${WEB_PORT:-13000}:3000"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e
          "fetch('http://127.0.0.1:3000/api/health')
          .then(r=>process.exit(r.ok?0:1))
          .catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging: *default-logging
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_TRANSPORT_PROTOCOL:-auto}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  pgdata:
